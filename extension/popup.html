<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stashly</title>
    <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
    <section id="setup" hidden>
        <p>Set your Stashly server first.</p>
        <button id="open-options" type="button">Open options</button>
    </section>

    <main id="main" hidden>
        <form id="stash-form" class="row">
            <input id="stash" list="recent" placeholder="Stash name or link" aria-label="Stash" autocomplete="off" spellcheck="false" required>
            <datalist id="recent"></datalist>
            <button id="open-stash" type="submit" title="Show this stash's clips here">Open</button>
            <button id="open-tab" type="button" class="icon" title="Open the stash in a browser tab" aria-label="Open the stash in a browser tab"></button>
        </form>

        <form id="unlock-form" hidden>
            <p class="hint">This stash has a password.</p>
            <div class="row">
                <input id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
                <select id="session" aria-label="Stay signed in for"></select>
                <button type="submit">Unlock</button>
            </div>
        </form>

        <form id="note-form">
            <textarea id="text" rows="3" placeholder="Type or paste text to add, or drop a file here" aria-label="Text to add"></textarea>
            <div class="row">
                <button id="add" type="submit">Add</button>
                <button id="send-clipboard" type="button" class="icon" title="Add what is on the clipboard" aria-label="Add what is on the clipboard"></button>
                <label id="file-button" class="button icon" title="Add a file (or drop one onto this window)" aria-label="Add a file"><input id="file" type="file" hidden></label>
                <p id="status" role="status"></p>
            </div>
        </form>

        <section class="clips">
            <input id="search" type="search" placeholder="Search clips" aria-label="Search the stash" autocomplete="off" spellcheck="false">
            <ul id="notes" aria-label="Clips"></ul>
            <p id="notes-info" class="hint" aria-live="polite"></p>
        </section>
    </main>
    <div id="drop-hint" hidden>Drop to upload</div>
    <script src="common.js"></script>
    <script src="emoji.js"></script>
    <script src="popup.js"></script>
</body>
</html>
