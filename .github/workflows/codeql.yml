# Static analysis of the JavaScript (server, pages and browser extension) with GitHub's CodeQL.
name: CodeQL

# Switched off for now: it only runs when started by hand (Actions tab -> CodeQL -> Run workflow).
# To turn it back on, restore these triggers:
#   push: { branches: [main] }
#   pull_request: { branches: [main] }
#   schedule: [{ cron: '23 4 * * 1' }]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
