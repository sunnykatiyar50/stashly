# Stashly, using the prebuilt image from GitHub Container Registry.
#
#   cp .env.example .env     # then set SESSION_SECRET, ADMIN_PASSWORD and anything else you need
#   docker compose up -d
#   docker compose pull && docker compose up -d     # update to the latest image
#   IMAGE_TAG=0.1.0 docker compose up -d             # pin a released version (see the Releases page)
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build   # build from source
services:
  stashly:
    image: ghcr.io/sunnykatiyar50/stashly:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    # Settings live in .env, not here: copy .env.example to .env and fill in what you need
    # (SESSION_SECRET and ADMIN_PASSWORD are the ones to set). The file is optional.
    env_file:
      - path: .env
        required: false
    volumes:
      - stashly-data:/data
    restart: unless-stopped

volumes:
  stashly-data:
